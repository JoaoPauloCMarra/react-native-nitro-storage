name: Publish npm

on:
  release:
    types: [published]

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24"
  PACKAGE_DIR: packages/react-native-nitro-storage

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
          no-cache: true

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install C++ coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm

      - run: bun install --frozen-lockfile

      - name: Validate release tag
        run: |
          version="$(node -p "require('./${PACKAGE_DIR}/package.json').version")"
          expected_tag="v${version}"
          if [ "${RELEASE_TAG}" != "${expected_tag}" ]; then
            echo "::error::Release tag ${RELEASE_TAG} does not match package version ${expected_tag}"
            exit 1
          fi

      - name: Check npm version availability
        run: |
          package_name="$(node -p "require('./${PACKAGE_DIR}/package.json').name")"
          version="$(node -p "require('./${PACKAGE_DIR}/package.json').version")"
          if npm view "${package_name}@${version}" version >/dev/null 2>&1; then
            echo "::error::${package_name}@${version} is already published"
            exit 1
          fi

      - name: Release preflight
        env:
          CC: clang
          CXX: clang++
        run: bun run release:preflight

      - name: Publish to npm
        run: bun run publish-package -- --yes --with-coverage --tag="${DIST_TAG}"
