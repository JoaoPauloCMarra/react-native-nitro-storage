appId: com.nitrostorage.example
name: "Smoke Tests - Terminal State"
---
- clearState
- launchApp
- scrollUntilVisible:
    element: "Smoke Test"
    direction: UP
    speed: 100
    timeout: 120000
- tapOn: "Run All"
- extendedWaitUntil:
    notVisible: "Running..."
    timeout: 120000
- assertVisible:
    text: ".*[1-9][0-9]*/[0-9]+ passed.*"
- assertNotVisible:
    text: ".*failed.*"
