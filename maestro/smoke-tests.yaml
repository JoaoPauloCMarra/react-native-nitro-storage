appId: com.nitrostorage.example
name: "Smoke Tests - Terminal State"
---
- clearState
- launchApp
- scrollUntilVisible:
    element: "Smoke Test"
    direction: UP
    speed: 100
    timeout: 120000
- tapOn: "Run All"
- extendedWaitUntil:
    visible:
      id: "smoke-summary"
      text: "Complete: PASS: [1-9][0-9]*/[0-9]+ passed · 0 failed.*"
    timeout: 120000
- assertNotVisible:
    text: "Complete: FAIL.*"
