appId: com.nitrostorage.example
name: "Nitro Storage - Smoke Test"
---
- launchApp:
    clearState: true

# Scroll to the Smoke Test runner at the bottom. Fixed swipes are more stable
# on iOS because the button is exposed as accessibility text/resource-id but
# scrollUntilVisible can miss it inside the nested Expo scroll view.
- repeat:
    times: 7
    commands:
      - swipe:
          direction: UP

# Tap "Run All" to execute every smoke test
- tapOn:
    id: "smoke-run-all"

# Wait for the run to start, then for the terminal state (button reverts to
# "Run All" only after every test reached pass/skip/fail).
- extendedWaitUntil:
    visible: "Running..."
    timeout: 30000
- extendedWaitUntil:
    notVisible: "Running..."
    timeout: 120000

# Assert the run completed with at least one passed test and zero failures.
# The count-independent pattern rejects a zero-passed summary (e.g. "0/7 passed").
- assertVisible:
    text: "[1-9][0-9]*/[0-9]+ passed"
- assertNotVisible:
    text: ".*failed.*"
